<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Perfil</title>
</head>

<body id="body">
    <div id="caja">
        <img id="avatar" alt="" />
        <p id="descripcion"></p>
        <h1 id="nombre"></h1>

        <div id="icono">
            <div id="icono-usuario">👤</div>
            <div id="icono-email">📧</div>
            <div id="icono-cumpleaños">🎉</div>
            <div id="icono-direccion">🏠</div>
            <div id="icono-telefono">📞</div>
            <div id="icono-seguridad">🔒</div>
        </div>
        <button id="direccion">DIRECCION</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const posicion = parseInt(params.get('posicion')) || 0;

            let res = await axios.get(`https://randomuser.me/api/?results=50&seed=tablero`);

            let imagen = document.getElementById("avatar");
            imagen.src = res.data.results[posicion].picture.large;

            let contenedorIconos = document.getElementById("icono");
            let nombre = document.getElementById("nombre");
            let descripcion = document.getElementById("descripcion");

            descripcion.textContent = "Mi nombre es";
            nombre.textContent = `${res.data.results[posicion].name.first} ${res.data.results[posicion].name.last}`;

            if (contenedorIconos) {
                contenedorIconos.addEventListener("mouseover", (event) => {
                    if (event.target.id === "icono-usuario") {
                        descripcion.textContent = "Mi nombre es";
                        nombre.textContent = `${res.data.results[posicion].name.first} ${res.data.results[posicion].name.last}`;
                    } else if (event.target.id === "icono-email") {
                        descripcion.textContent = "Mi correo electrónico es";
                        nombre.textContent = res.data.results[posicion].email;
                    } else if (event.target.id === "icono-direccion") {
                        descripcion.textContent = "Mi dirección es";
                        nombre.textContent = `${res.data.results[posicion].location.street.name} ${res.data.results[posicion].location.street.number}`;
                    } else if (event.target.id === "icono-cumpleaños") {
                        descripcion.textContent = "Mi fecha de nacimiento es";
                        nombre.textContent = res.data.results[posicion].dob.date.slice(0, 10);
                    } else if (event.target.id === "icono-telefono") {
                        descripcion.textContent = "Mi teléfono es";
                        nombre.textContent = res.data.results[posicion].phone;
                    } else if (event.target.id === "icono-seguridad") {
                        descripcion.textContent = "Mi contraseña es";
                        nombre.textContent = res.data.results[posicion].login.password;
                    }
                });
            }

            let direccion = document.getElementById("direccion");
            direccion.addEventListener("click", () => {
                let lat = res.data.results[posicion].location.coordinates.latitude;
                let lng = res.data.results[posicion].location.coordinates.longitude;
                window.open(`https://www.google.com/maps?q=${lat},${lng}`);
            });
        });
    </script>

    <style>
        #body {
            background-color: lightblue;
            display: grid;
            place-items: center;
            height: 100vh;
        }

        #caja {
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            height: 400px;
            display: grid;
            place-items: center;
            align-items: center;
            justify-items: center;
            align-content: center;
        }

        #icono {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        #avatar {
            border-radius: 50%;
        }

        #nombre {
            color: red;
        }

        #icono div {
            font-size: 40px;
            cursor: pointer;
        }

        #direccion {
            background: yellow;
            height: 100px;
            width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</body>

</html>
