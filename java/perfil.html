<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Perfil</title>
</head>

<body id="body">
    <button onclick="window.location.href='index.html'" class="regreso"><p>🔙</p></button>
    <button id="favoritos" onclick="window.location.href= 'favoritos.html'"><p>⭐</p></button>

    <div id="caja">
        <img id="avatar" alt="" />
        <p id="descripcion"></p>
        <h1 id="nombre"></h1>

        <div id="icono">
            <div id="icono-usuario">👤</div>
            <div id="icono-email">📧</div>
            <div id="icono-cumpleaños">🎉</div>
            <div id="icono-direccion">🏠</div>
            <div id="icono-telefono">📞</div>
            <div id="icono-seguridad">🔒</div>
        </div>
        <button id="direccion">DIRECCION</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const usuarioGuardado = localStorage.getItem('usuarioSeleccionado');

            if (!usuarioGuardado) {
                console.error("No hay usuario guardado en localStorage");
                return;
            }

            let res = {
                data: JSON.parse(usuarioGuardado)
            };

            let imagen = document.getElementById("avatar");
            imagen.src = res.data.picture.large;

            let contenedorIconos = document.getElementById("icono");
            let nombre = document.getElementById("nombre");
            let descripcion = document.getElementById("descripcion");

            descripcion.textContent = "Mi nombre es";
            nombre.textContent = `${res.data.name.first} ${res.data.name.last}`;

            if (contenedorIconos) {
                contenedorIconos.addEventListener("mouseover", (event) => {
                    if (event.target.id === "icono-usuario") {
                        descripcion.textContent = "Mi nombre es";
                        nombre.textContent = `${res.data.name.first} ${res.data.name.last}`;
                    } else if (event.target.id === "icono-email") {
                        descripcion.textContent = "Mi correo electrónico es";
                        nombre.textContent = res.data.email;
                    } else if (event.target.id === "icono-direccion") {
                        descripcion.textContent = "Mi dirección es";
                        nombre.textContent = `${res.data.location.street.name} ${res.data.location.street.number}`;
                    } else if (event.target.id === "icono-cumpleaños") {
                        descripcion.textContent = "Mi fecha de nacimiento es";
                        nombre.textContent = res.data.dob.date.slice(0, 10);
                    } else if (event.target.id === "icono-telefono") {
                        descripcion.textContent = "Mi teléfono es";
                        nombre.textContent = res.data.phone;
                    } else if (event.target.id === "icono-seguridad") {
                        descripcion.textContent = "Mi contraseña es";
                        nombre.textContent = res.data.login.password;
                    }
                });
            }

            let direccion = document.getElementById("direccion");
            direccion.addEventListener("click", () => {
                let lat = res.data.location.coordinates.latitude;
                let lng = res.data.location.coordinates.longitude;
                window.open(`https://www.google.com/maps?q=${lat},${lng}`);
            });

            let btnFavoritos = document.getElementById("favoritos");
            btnFavoritos.addEventListener("click", () => {
                let listaFavoritos = JSON.parse(localStorage.getItem('listaFavoritos')) || [];
                const usuarioSeleccionado = res.data;

                const yaExiste = listaFavoritos.some(user => user.login.uuid === usuarioSeleccionado.login.uuid);

                if (!yaExiste) {
                    listaFavoritos.push(usuarioSeleccionado);
                    localStorage.setItem('listaFavoritos', JSON.stringify(listaFavoritos));
                    alert('¡Usuario agregado a favoritos!');
                } else {
                    alert('Este usuario ya está en tus favoritos');
                }
            });
        });
    </script>

    <style>
        #body {
            background-color: lightblue;
            display: grid;
            place-items: center;
            height: 100vh;
        }

        #caja {
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            height: 400px;
            display: grid;
            place-items: center;
            align-items: center;
            justify-items: center;
            align-content: center;
            position: relative;

        }

        #icono {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        #avatar {
            border-radius: 50%;
        }

        #nombre {
            color: red;
        }

        #icono div {
            font-size: 40px;
            cursor: pointer;
        }

        #direccion {
            background: yellow;
            height: 100px;
            width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }

        .regreso {
            font-size: 50px;
            text-align: end;
            display: grid;
            background-color: transparent;
            border: transparent;
            position: absolute;
            right:  690px;
            top: 50px;
            z-index: 1;
            cursor: pointer;
        }

        #favoritos {
            font-size: 40px;
            background-color: transparent;
            border: transparent;
            cursor: pointer;
            position: absolute;
            left: 690px;
            top: 70px;
            z-index: 1;
        }
    </style>
</body>

</html>
